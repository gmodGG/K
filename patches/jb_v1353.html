lock}.done #spin,.fail #spin{display:none}.done #msg,.fail #msg{display:block}.done #msg{color:var(--ok)}.fail #msg{color:var(--bad)}#wrap{display:none;max-width:980px;margin:0 auto;padding:20px}.panel{border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,#10171e,#070a0e);box-shadow:0 28px 80px rgba(0,0,0,.42);overflow:hidden}.panel-head{padding:17px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.panel-title{font-size:13px;font-weight:850}.panel-sub{color:var(--dim);font-size:7px;text-transform:uppercase;letter-spacing:.16em}.live-dot{display:flex;align-items:center;gap:6px;color:var(--ok);font-size:7px;font-weight:950;letter-spacing:.13em}.live-dot i{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px rgba(154,242,191,.55)}.statebox{margin:16px 20px 10px;padding:15px;border:1px solid var(--line2);border-radius:14px;background:#0a0f14}.state-label{color:#687583;font-size:7px;font-weight:950;letter-spacing:.17em;text-transform:uppercase}.state-value{margin-top:4px;font-size:18px;font-weight:850}.state-line{height:3px;margin-top:12px;border-radius:99px;background:#18212a;overflow:hidden}.state-line span{display:block;width:32%;height:100%;background:linear-gradient(90deg,#476552,var(--ok));animation:flow 1.1s ease-in-out infinite}.done .state-line span{width:100%;animation:none}.fail .state-line span{width:100%;animation:none;background:var(--bad)}#wrap .mini{display:flex;gap:7px;margin:0 20px 10px;flex-wrap:wrap}.chip{padding:5px 8px;border:1px solid var(--line);border-radius:7px;background:#090e13;color:#667482;font-size:7px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}.chip.ok{color:var(--ok);border-color:#294838;background:#0b1511}body.log #wrap{display:block}body.log #out{white-space:pre-wrap;font:11px/1.55 Consolas,monospace;background:#080c11;border:1px solid var(--line);border-radius:12px;padding:13px;margin:0 20px 20px;height:calc(1 </style></head><body><script>(function(){function showBrowserFailure(kind,detail){try{var msg=document.getElementById("msg");if(!msg)return;msg.textContent=kind+": "+String(detail||"unknown error");document.body.className="fail"}catch(e){}}window.addEventListener("error",function(e){showBrowserFailure("Browser error",e&&(e.message||e.error)||"unknown")});window.addEventListener("unhandledrejection",function(e){var r=e&&e.reason;showBrowserFailure("Unhandled error",r&&r.message||r||"unknown")});})();</script><div id="brand"><div class="brand-main"><div class="mark"></div><div><b>RAW GAME</b><small>EXECUTION ENVIRONMENT</small></div></div><div class="phase"><i></i><span>LOCAL RUNTIME</span><b id="phaseText">RUNNING</b></div></div><div id="spin"></div><div id="msg">Restart your console</div><button id="retry" type="button" hidden>Reload launcher</button><a id="diagLink" href="diagnostics_v1353.html" rel="noopener">Diagnostics</a><div id="wrap"><div class="panel"><div class="panel-head"><div><div class="panel-title">Execution monitor</div><div class="panel-sub">Local runtime · bounded recovery</div></div><div class="live-dot"><i></i>LIVE</div></div><div class="statebox"><div class="state-label">Current phase</div><div id="state" class="state-value">Starting…</div><div class="state-line"><span></span></div></div><div class="mini"><span class="chip ok">Local runtime</span><span class="chip">Offline capable</span><span class="chip">Bounded recovery</span><span class="chip">No external assets</span></div><div id="out"></div></div></div><script src="diagnostics_v1353.js?v=20261003-1353"></script>
<script type="module">import "./jb_v1353.js?v=20261003-1353";</script>
<script>
(function(){
  "use strict";
  window.__RAWGAME_MODULE_WATCHDOG_FIRED=false;
  if(window.__RAWGAME_DIAG_EVENT) window.__RAWGAME_DIAG_EVENT("launcher","watchdog.install","v13.5.3");
  window.__RAWGAME_WATCHDOG_PHASE="boot";
  var retry=document.getElementById("retry");
  if(retry) retry.addEventListener("click",function(){
    if(window.__RAWGAME_EXECUTION_FINISHED) return;
    if(window.__RAWGAME_DIAG_EVENT) window.__RAWGAME_DIAG_EVENT("launcher","watchdog.manual-retry","user");
    location.reload();
  },false);
  var bootWarn=setTimeout(function(){
    if(window.__RAWGAME_MODULE_BOOTED || window.__RAWGAME_EXECUTION_FINISHED) return;
    window.__RAWGAME_MODULE_WATCHDOG_FIRED=true;
    if(window.__RAWGAME_DIAG_EVENT) window.__RAWGAME_DIAG_EVENT("launcher","watchdog.warn","15000ms");
    window.__RAWGAME_WATCHDOG_PHASE="module-warn";
    var msg=document.getElementById("msg");
    if(!msg) return;
    msg.textContent="Execution is taking longer than expected";
    msg.setAttribute("role","status");
    msg.style.display="block";
    msg.style.color="var(--warn)";
  },15000);
  var bootFail=setTimeout(function(){
    if(window.__RAWGAME_MODULE_BOOTED || window.__RAWGAME_EXECUTION_FINISHED) return;
    window.__RAWGAME_WATCHDOG_PHASE="module-timeout";
    if(window.__RAWGAME_DIAG_EVENT) window.__RAWGAME_DIAG_EVENT("launcher","watchdog.timeout","30000ms");
    var msg=document.getElementById("msg");
    if(!msg) return;
    msg.textContent="Execution module did not start";
    msg.setAttribute("role","alert");
    document.body.className="fail";
    if(retry) retry.hidden=false;
  },30000);
  window.__RAWGAME_MODULE_WATCHDOG=bootFail;
  window.__RAWGAME_CLEAR_WATCHDOG=function(){
    try{clearTimeout(bootWarn);}catch(e){}
    try{clearTimeout(bootFail);}catch(e){}
  };
  var softGuard=setInterval(function(){
    try{
      if(window.__RAWGAME_EXECUTION_FINISHED){clearInterval(softGuard);return;}
      if(window.__RAWGAME_MODULE_BOOTED && typeof window.__RAWGAME_LAST_PROGRESS==="number"){
        var stale=Date.now()-window.__RAWGAME_LAST_PROGRESS;
        if(stale>60000 && stale<=180000){
          var sm=document.getElementById("msg");
          if(sm && document.body.className!=="done" && document.body.className!=="fail") {
            window.__RAWGAME_WATCHDOG_PHASE="progress-stale-warning";
            sm.textContent="Execution is still active — waiting for the next checkpoint";
            sm.setAttribute("role","status");
            sm.style.display="block";
            sm.style.color="var(--warn)";
          }
        } else if(stale>180000){
          var dm=document.getElementById("msg");
          if(dm && document.body.className!=="done" && document.body.className!=="fail") {
            window.__RAWGAME_WATCHDOG_PHASE="progress-stale-terminal";
            dm.textContent="No progress checkpoint for more than 3 minutes — reboot before another attempt";
            dm.setAttribute("role","alert");
            dm.style.display="block";
            dm.style.color="var(--bad)";
            if(window.__RAWGAME_DIAG_EVENT) window.__RAWGAME_DIAG_EVENT("launcher","watchdog.stale-terminal","180000ms");
          }
          clearInterval(softGuard);
        } else if(stale<=60000){
          var okm=document.getElementById("msg");
          if(okm && !window.__RAWGAME_EXECUTION_FINISHED) okm.style.display="none";
        }
      }
    }catch(e){}
  },5000);
  window.addEventListener("error",function(e){
    if(window.__RAWGAME_EXECUTION_FINISHED) return;
    if(e && e.target && e.target.tagName==="SCRIPT"){
      var msg=document.getElementById("msg");
      if(msg){
        msg.textContent="Execution module failed to load";
        msg.setAttribute("role","alert");
        document.body.className="fail";
        if(retry) retry.hidden=false;
        if(window.__RAWGAME_DIAG_EVENT) window.__RAWGAME_DIAG_EVENT("launcher","module-load-failed",e&&e.message?e.message:"script error");
      }
    }
  },true);
  window.addEventListener("unhandledrejection",function(e){
    if(window.__RAWGAME_EXECUTION_FINISHED) return;
  },true);
})();
</script></body></html>
